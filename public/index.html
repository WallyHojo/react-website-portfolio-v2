<!DOCTYPE html>
<html lang="en">
  <head>

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />
    <title>Walter Carlson</title>

    <link rel="canonical" href="https://v2.waltercarlson.dev/" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Walter Carlson" />
    <meta property="og:title" content="Walter Carlson" />
    <meta property="og:description" content="Walter Carlson is a UI Engineer building accessible, scalable interfaces that bridge design and engineering, from wireframes to production-ready front-end." />
    <meta property="og:url" content="https://v2.waltercarlson.dev/" />
    <meta property="og:image" content="https://v2.waltercarlson.dev/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Walter Carlson, UI Engineer — v2.waltercarlson.dev" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Walter Carlson" />
    <meta name="twitter:description" content="Walter Carlson is a UI Engineer building accessible, scalable interfaces that bridge design and engineering, from wireframes to production-ready front-end." />
    <meta name="twitter:image" content="https://v2.waltercarlson.dev/og-image.png" />
    <!-- Text snapshot in #root (see scripts/prerender.js): readable without JS, hidden once JS runs -->
    <script>document.documentElement.classList.add("js")</script>
    <link rel="preload" href="%PUBLIC_URL%/media/Inter-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="%PUBLIC_URL%/media/Montserrat-Regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="%PUBLIC_URL%/media/Montserrat-Medium.woff2" as="font" type="font/woff2" crossorigin>  

    <style>
      @font-face {
        font-family: "Montserrat";
        src: url('/media/Montserrat-Medium.woff2') format('woff2'),
            url('/media/Montserrat-Medium.woff') format('woff');
        font-weight: 500;
        font-display: swap;
      }
      @font-face {
        font-family: "Montserrat";
        src: url('/media/Montserrat-Regular.woff2') format('woff2'),
            url('/media/Montserrat-Regular.woff') format('woff');
        font-weight: 400;
        font-display: swap;
      }
      @font-face {
        font-family: "Inter";
        src: url('/media/Inter-Regular.woff2') format('woff2'),
            url('/media/Inter-Regular.woff') format('woff');
        font-weight: 400;
        font-display: swap;
      }
      .prerender { max-width: 60rem; padding: 2rem; font-family: Inter, sans-serif; line-height: 1.6; }
      .js .prerender { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
    </style>    
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
